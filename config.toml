# ─────────────────────────────────────────────────────────────
#  AI Radar — configurazione
#  Modifica liberamente: profilo, hardware, fonti, budget LLM.
# ─────────────────────────────────────────────────────────────

[profile]
# Testo libero passato all'LLM per decidere cosa ti interessa davvero.
description = """
Sviluppatore/ricercatore ML in Italia. Ho una NVIDIA RTX 5090 (32 GB VRAM) e voglio sapere
subito quali nuovi modelli open-weight posso far girare in locale (llama.cpp, vLLM, Ollama, LM Studio),
con che quantizzazione e con quanto contesto.
Seguo anche i modelli frontier closed (Claude, GPT, Gemini, Qwen-Max...): mi interessano benchmark,
prezzi, context window e nuove funzionalità delle API.
Interessi specifici: embedding e retrieval, RAG, tecniche tipo vec2vec (traduzione tra spazi di embedding),
interpretabilità, quantizzazione, inference efficiente, fine-tuning su GPU consumer, agenti e coding tools,
nuove librerie/tool open source davvero utili.
Non mi interessano: gossip, finanziamenti e business se non cambiano cosa posso usare, merge/finetune
"uncensored" di bassa qualità, prompt pack, clickbait.
"""
# Parole chiave usate per il punteggio euristico (prima dell'LLM e quando l'LLM non è disponibile).
keywords = [
  "release", "released", "introducing", "launch", "open-weight", "open weights", "open-source", "weights",
  "gguf", "quantiz", "llama.cpp", "vllm", "ollama", "lm studio", "mlx", "nvfp4", "fp8",
  "embedding", "retrieval", "rerank", "rag", "vec2vec", "interpretab", "sparse autoencoder",
  "benchmark", "context window", "moe", "mixture of experts", "reasoning", "agent", "coding",
  "fine-tun", "lora", "distill", "speculative", "mtp", "kv cache", "long context",
  "qwen", "deepseek", "llama", "gemma", "mistral", "kimi", "glm", "minimax", "nemotron",
  "claude", "fable", "opus", "sonnet", "gpt", "gemini", "grok",
]

[hardware]
gpu_name = "RTX 5090"
vram_gb = 32            # GiB
reserved_gb = 1.0       # VRAM occupata da desktop/driver, non usabile dal modello
margin_gb = 1.5         # margine libero richiesto per la quantizzazione "consigliata" (sotto = "al limite")
# Formati con accelerazione hardware della GPU (Blackwell: FP4 e FP8). Usati da vLLM, SGLang, TensorRT-LLM
# e dalle GGUF NVFP4 di llama.cpp. prefer_native = il verdetto principale usa il formato nativo quando entra.
native_formats = ["NVFP4", "FP8"]
prefer_native = true
bandwidth_gbs = 1792    # banda memoria GB/s (per stimare i token/s)
system_ram_gb = 64      # RAM di sistema, per capire se un MoE gira con offload degli esperti
ref_context = 32768     # contesto di riferimento per il verdetto "gira / non gira"
contexts = [8192, 32768, 131072]

[run]
timezone = "Europe/Rome"
lookback_hours = 30      # finestra delle notizie per ogni esecuzione giornaliera
bootstrap_days = 7       # alla prima esecuzione guarda indietro di N giorni
new_model_days = 14      # un modello è "nuovo" se creato negli ultimi N giorni
max_items_per_day = 150  # quante notizie tenere nella pagina del giorno
min_relevance = 3        # sotto questa soglia (0-10) le notizie vengono scartate (solo con LLM)

[llm]
# Budget. Con i modelli a pagamento scelti sotto una chiamata costa ~0,001 $: un'esecuzione giornaliera
# ~0,02-0,05 $, circa 1 $/mese. max_cost_per_run_usd è un tetto di sicurezza: superato, si usano solo i gratuiti.
# Solo modelli gratuiti (models = ["auto:free"]): 50 richieste/giorno, 1000 se hai acquistato ≥10 $ di crediti.
max_cost_per_run_usd = 0.30
max_calls_per_run = 100
triage_items = 160       # quante notizie (le più promettenti) mandare all'LLM per la valutazione
triage_batch = 12        # notizie per chiamata
max_deep_dives = 16      # schede modello approfondite (benchmark, feature) per esecuzione
temperature = 0.2
parallel = 6             # chiamate LLM in parallelo
call_timeout_s = 120     # durata massima di una singola chiamata
time_budget_s = 1200     # tempo massimo totale per l'LLM: poi si prosegue con le euristiche

# Provider OpenAI-compatibili, provati in ordine. Se uno fallisce o esaurisce il budget si passa al successivo.
[[llm.providers]]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# Provati in ordine; "auto:free" = tutti i modelli gratuiti disponibili oggi, come riserva.
# Misurati a novembre 2026 su valutazione notizie ed estrazione benchmark (numeri corretti, 3-15 s, ~0,001 $/chiamata).
# models      = valutazione delle notizie (tante chiamate: conta velocità e prezzo)
# deep_models = schede modello, benchmark ed editoriale (poche chiamate: conta la precisione)
models = ["deepseek/deepseek-v4.1-flash", "openai/gpt-6-luna", "auto:free"]
deep_models = ["anthropic/claude-haiku-5.5", "deepseek/deepseek-v4.1-flash", "auto:free"]
# Ordine di preferenza tra i modelli gratuiti di riserva (sottostringhe dell'id).
prefer = ["nemotron-3-ultra", "nemotron-3.5-super", "particle-1", "dots-3", "north-mini", "nemotron-3.5-lightning"]

[site]
# Modello usato dal sito (nel tuo browser) per il consiglio nel confronto tra modelli
advice_model = "anthropic/claude-haiku-5.5"

[papers]
days_kept = 60           # quanti giorni di paper tenere nella sezione Paper
lookback_days = 4        # finestra di raccolta giornaliera (arXiv pubblica con 1-2 giorni di ritardo)
max_per_run = 400        # paper nuovi valutati dall LLM per esecuzione (~0,001 $ ogni 12 paper)
arxiv_per_topic = 30     # paper più recenti presi da arXiv per ogni argomento
default_topics = ["interp", "alignment", "embalign", "efficiency", "retrieval", "agents", "reasoning"]
feeds = [
  { name = "Alignment Forum", url = "https://www.alignmentforum.org/feed.xml" },
]

# Argomenti: id, etichetta, descrizione per l'LLM, frasi cercate su arXiv (titolo/abstract)
[[papers.topics]]
id = "alignment"
label = "Allineamento (safety)"
desc = "AI/safety alignment: making model behaviour match human intentions and values — RLHF/RLAIF, preference optimization, reward hacking, scalable oversight, specification gaming, value alignment. NOT the alignment of embedding/representation spaces"
arxiv = ["AI alignment", "value alignment", "RLHF", "reward hacking", "scalable oversight", "preference optimization", "alignment faking"]

[[papers.topics]]
id = "embalign"
label = "Allineamento di embedding"
desc = "alignment of embedding/representation spaces across models, layers or modalities: embedding translation without paired data (vec2vec), model stitching, Platonic Representation Hypothesis, representational similarity (CKA), cross-lingual and cross-modal embedding alignment, representation alignment objectives (e.g. REPA). NOT safety alignment"
arxiv = ["embedding alignment", "representation alignment", "embedding space translation", "aligning embedding spaces",
         "Platonic representation hypothesis", "model stitching", "representational similarity", "cross-model embedding"]

[[papers.topics]]
id = "interp"
label = "Interpretabilità meccanicistica"
desc = "mechanistic interpretability, sparse autoencoders, circuits, probing, steering, feature attribution"
arxiv = ["mechanistic interpretability", "sparse autoencoder", "circuit discovery", "activation steering", "probing"]

[[papers.topics]]
id = "safety"
label = "Sicurezza e red teaming"
desc = "AI safety, jailbreak, red teaming, deception, sandbagging, dangerous capabilities, monitoring"
arxiv = ["jailbreak", "red teaming", "AI safety", "deceptive alignment", "sandbagging"]

[[papers.topics]]
id = "reasoning"
label = "Ragionamento e RL"
desc = "reasoning, chain-of-thought, test-time compute, reinforcement learning with verifiable rewards"
arxiv = ["reasoning models", "chain-of-thought", "test-time compute", "verifiable rewards"]

[[papers.topics]]
id = "agents"
label = "Agenti e tool use"
desc = "LLM agents, tool use, computer use, coding agents, multi-agent systems, memory for agents"
arxiv = ["LLM agents", "tool use", "computer use agent", "coding agent", "multi-agent"]

[[papers.topics]]
id = "efficiency"
label = "Efficienza e quantizzazione"
desc = "quantization, KV cache, speculative decoding, distillation, pruning, efficient inference, serving"
arxiv = ["quantization", "KV cache", "speculative decoding", "efficient inference", "knowledge distillation"]

[[papers.topics]]
id = "architecture"
label = "Architetture"
desc = "attention variants, state space models, mixture of experts, linear attention, long context, tokenization"
arxiv = ["mixture of experts", "state space model", "linear attention", "long context", "tokenizer"]

[[papers.topics]]
id = "retrieval"
label = "Embedding e retrieval"
desc = "embedding models for search and retrieval, retrieval-augmented generation, dense/sparse retrieval, rerankers, vector search (for aligning embedding spaces use embalign)"
arxiv = ["text embeddings", "retrieval-augmented generation", "dense retrieval", "reranker", "embedding space"]

[[papers.topics]]
id = "multimodal"
label = "Multimodale"
desc = "vision-language models, video understanding, speech and audio models, omni models"
arxiv = ["vision-language model", "multimodal large language model", "speech language model"]

[[papers.topics]]
id = "generative"
label = "Immagini e video generativi"
desc = "diffusion, flow matching, image generation and editing, video generation"
arxiv = ["diffusion model", "flow matching", "video generation", "image editing"]

[[papers.topics]]
id = "evaluation"
label = "Valutazione e benchmark"
desc = "benchmarks, evaluation methodology, contamination, LLM-as-judge"
arxiv = ["benchmark", "evaluation of large language models", "LLM-as-a-judge", "data contamination"]

[[papers.topics]]
id = "training"
label = "Dati e training"
desc = "pretraining, synthetic data, scaling laws, data curation, fine-tuning methods, optimizers"
arxiv = ["pretraining", "synthetic data", "scaling laws", "data curation", "fine-tuning"]

[[papers.topics]]
id = "robotics"
label = "Robotica ed embodied"
desc = "robotics, vision-language-action models, embodied agents, world models"
arxiv = ["vision-language-action", "robot learning", "embodied agent", "world model"]

[embeddings]
# Leaderboard MTEB ufficiale. language_scores = aggiunge il punteggio sulla lingua scelta (task in quella lingua).
language = "Italian"
top_n = 150              # modelli per benchmark (più tutti quelli usciti di recente)
new_days = 45            # "nuovo" = uscito negli ultimi N giorni
benchmarks = [
  { name = "MTEB(Multilingual, v2)", label = "Multilingue", language_scores = true },
  { name = "MTEB(eng, v2)", label = "Inglese" },
  { name = "MTEB(Europe, v1)", label = "Europa", language_scores = true },
  { name = "MTEB(Code, v1)", label = "Codice" },
  { name = "LongEmbed", label = "Documenti lunghi" },
  { name = "BRIGHT", label = "Retrieval con ragionamento" },
]


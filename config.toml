[sources]
hackernews_min_points = 40
reddit_min_score = 0
papers_min_upvotes = 8
github_min_stars = 80
github_topics = ["llm", "large-language-models", "embeddings", "rag", "ai-agents", "local-llm"]
hf_trending_limit = 100
hf_min_likes = 20
# Organizzazioni HF controllate direttamente (trova i rilasci ufficiali anche prima che siano in trending)
hf_orgs = [
  "Qwen", "deepseek-ai", "meta-llama", "google", "mistralai", "microsoft", "nvidia", "openai",
  "moonshotai", "zai-org", "MiniMaxAI", "ibm-granite", "allenai", "LiquidAI", "tencent", "baidu",
  "inclusionAI", "stepfun-ai", "XiaomiMiMo", "meituan-longcat", "thinkingmachines", "NousResearch",
  "black-forest-labs", "Lightricks", "jinaai", "BAAI", "nomic-ai", "Alibaba-NLP", "mixedbread-ai",
  "HuggingFaceTB", "apple", "ByteDance-Seed", "cohere", "CohereLabs", "arcee-ai", "Zyphra",
]


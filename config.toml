# ─────────────────────────────────────────────────────────────
#  AI Radar — configurazione
#  Modifica liberamente: profilo, hardware, fonti, budget LLM.
# ─────────────────────────────────────────────────────────────

[profile]
# Testo libero passato all'LLM per decidere cosa ti interessa davvero.
description = """
Sviluppatore/ricercatore ML in Italia. Ho una NVIDIA RTX 5090 (32 GB VRAM) e voglio sapere
subito quali nuovi modelli open-weight posso far girare in locale (llama.cpp, vLLM, Ollama, LM Studio),
con che quantizzazione e con quanto contesto.
Seguo anche i modelli frontier closed (Claude, GPT, Gemini, Qwen-Max...): mi interessano benchmark,
prezzi, context window e nuove funzionalità delle API.
Interessi specifici: embedding e retrieval, RAG, tecniche tipo vec2vec (traduzione tra spazi di embedding),
interpretabilità, quantizzazione, inference efficiente, fine-tuning su GPU consumer, agenti e coding tools,
nuove librerie/tool open source davvero utili.
Non mi interessano: gossip, finanziamenti e business se non cambiano cosa posso usare, merge/finetune
"uncensored" di bassa qualità, prompt pack, clickbait.
"""
# Parole chiave usate per il punteggio euristico (prima dell'LLM e quando l'LLM non è disponibile).
keywords = [
  "release", "released", "introducing", "launch", "open-weight", "open weights", "open-source", "weights",
  "gguf", "quantiz", "llama.cpp", "vllm", "ollama", "lm studio", "mlx", "nvfp4", "fp8",
  "embedding", "retrieval", "rerank", "rag", "vec2vec", "interpretab", "sparse autoencoder",
  "benchmark", "context window", "moe", "mixture of experts", "reasoning", "agent", "coding",
  "fine-tun", "lora", "distill", "speculative", "mtp", "kv cache", "long context",
  "qwen", "deepseek", "llama", "gemma", "mistral", "kimi", "glm", "minimax", "nemotron",
  "claude", "fable", "opus", "sonnet", "gpt", "gemini", "grok",
]

[hardware]
gpu_name = "RTX 5090"
vram_gb = 32            # GiB
reserved_gb = 1.0       # VRAM occupata da desktop/driver, non usabile dal modello
bandwidth_gbs = 1792    # banda memoria GB/s (per stimare i token/s)
system_ram_gb = 64      # RAM di sistema, per capire se un MoE gira con offload degli esperti
ref_context = 32768     # contesto di riferimento per il verdetto "gira / non gira"
contexts = [8192, 32768, 131072]

[run]
timezone = "Europe/Rome"
lookback_hours = 30      # finestra delle notizie per ogni esecuzione giornaliera
bootstrap_days = 7       # alla prima esecuzione guarda indietro di N giorni
new_model_days = 14      # un modello è "nuovo" se creato negli ultimi N giorni
max_items_per_day = 150  # quante notizie tenere nella pagina del giorno
min_relevance = 3        # sotto questa soglia (0-10) le notizie vengono scartate (solo con LLM)

[llm]
# Budget: i modelli :free hanno 50 richieste/giorno (1000 se l'account ha acquistato ≥10$ di crediti, come il tuo).
# Con il limite da 50 riporta: max_calls_per_run = 24, triage_items = 100, max_deep_dives = 8.
max_calls_per_run = 45
triage_items = 160       # quante notizie (le più promettenti) mandare all'LLM per la valutazione
triage_batch = 20        # notizie per chiamata
max_deep_dives = 14      # schede modello approfondite (benchmark, feature) per esecuzione
temperature = 0.2

# Provider OpenAI-compatibili, provati in ordine. Se uno fallisce o esaurisce il budget si passa al successivo.
[[llm.providers]]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# "auto:free" = sceglie da solo i modelli gratuiti disponibili oggi (prima il router openrouter/free).
# Con qualche euro di credito puoi mettere un modello economico, es. ["deepseek/deepseek-v4.1-flash", "auto:free"]
models = ["auto:free"]

# Esempio di provider alternativo (decommenta e imposta la variabile d'ambiente):
# [[llm.providers]]
# name = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# api_key_env = "GEMINI_API_KEY"
# models = ["gemini-flash-latest"]

[sources]
hackernews_min_points = 40
reddit_min_score = 0
papers_min_upvotes = 8
github_min_stars = 80
github_topics = ["llm", "large-language-models", "embeddings", "rag", "ai-agents", "local-llm"]
hf_trending_limit = 100
hf_min_likes = 20
# Organizzazioni HF controllate direttamente (trova i rilasci ufficiali anche prima che siano in trending)
hf_orgs = [
  "Qwen", "deepseek-ai", "meta-llama", "google", "mistralai", "microsoft", "nvidia", "openai",
  "moonshotai", "zai-org", "MiniMaxAI", "ibm-granite", "allenai", "LiquidAI", "tencent", "baidu",
  "inclusionAI", "stepfun-ai", "XiaomiMiMo", "meituan-longcat", "thinkingmachines", "NousResearch",
  "black-forest-labs", "Lightricks", "jinaai", "BAAI", "nomic-ai", "Alibaba-NLP", "mixedbread-ai",
  "HuggingFaceTB", "apple", "ByteDance-Seed", "cohere", "CohereLabs", "arcee-ai", "Zyphra",
]


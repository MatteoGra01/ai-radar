<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Radar</title>
  <meta name="description" content="Rassegna quotidiana personale su nuovi modelli AI, benchmark e funzionalità">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='none' stroke='%234f46e5' stroke-width='3'/><circle cx='16' cy='16' r='7' fill='none' stroke='%234f46e5' stroke-width='3'/><circle cx='16' cy='16' r='2.5' fill='%234f46e5'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" /><circle cx="16" cy="16" r="6.5" /><circle cx="16" cy="16" r="2.2" class="dot"/></svg>
        AI Radar
      </a>
      <nav class="tabs" aria-label="Sezioni">
        <a href="#v=day" data-view="day">Oggi</a>
        <a href="#v=models" data-view="models">Modelli</a>
        <a href="#v=archive" data-view="archive">Archivio</a>
      </nav>
      <div class="top-right">
        <span id="gpu" class="gpu-chip" title="Hardware usato per i verdetti"></span>
        <button id="theme" class="icon-btn" type="button" aria-label="Cambia tema" title="Tema">◐</button>
      </div>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite">
    <p class="loading">Caricamento…</p>
  </main>

  <footer class="wrap foot" id="foot"></footer>

  <dialog id="modal" aria-label="Dettaglio modello">
    <div class="modal-inner">
      <button class="icon-btn modal-close" type="button" aria-label="Chiudi">✕</button>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
